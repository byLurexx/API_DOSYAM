<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Sistemi</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #00ff66;
            background:
                linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)),
                url("hacker-bg.jpg") center/cover fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .panel {
            width: 90%;
            max-width: 800px;
            padding: 35px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #00ff66;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff66;
        }

        .status {
            text-align: center;
            margin-bottom: 30px;
            color: #aaa;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 14px;
            background: #050505;
            color: #00ff66;
            border: 1px solid #00ff66;
            border-radius: 8px;
            outline: none;
        }

        button {
            padding: 14px 25px;
            background: #00ff66;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            box-shadow: 0 0 15px #00ff66;
        }

        .result {
            min-height: 200px;
            padding: 20px;
            background: #020202;
            border: 1px solid #222;
            border-radius: 8px;
            overflow: auto;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="panel">
        <h1>API SYSTEM</h1>

        <div class="status">
            ● Sistem hazır
        </div>

        <div class="input-group">
            <input
                type="text"
                id="apiUrl"
                placeholder="API URL'sini gir..."
            >

            <button onclick="sendRequest()">
                İSTEK GÖNDER
            </button>
        </div>

        <div class="result">
            <pre id="result">API cevabı burada görünecek...</pre>
        </div>

        <div class="footer">
            API Request Panel
        </div>
    </div>

    <script>
        async function sendRequest() {
            const url = document.getElementById("apiUrl").value;
            const result = document.getElementById("result");

            if (!url) {
                result.textContent = "Lütfen bir API URL'si gir.";
                return;
            }

            result.textContent = "İstek gönderiliyor...";

            try {
                const response = await fetch(url);

                const contentType =
                    response.headers.get("content-type") || "";

                let data;

                if (contentType.includes("application/json")) {
                    data = await response.json();

                    result.textContent =
                        JSON.stringify(data, null, 4);
                } else {
                    data = await response.text();

                    result.textContent = data;
                }

            } catch (error) {
                result.textContent =
                    "Hata: " + error.message;
            }
        }
    </script>

</body>
</html>
