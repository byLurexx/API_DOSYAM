<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAMTOOL • Viewer</title>

<style>
*{box-sizing:border-box}

:root{
--bg:#070914;
--panel:rgba(17,20,39,.88);
--border:rgba(255,255,255,.10);
--pink:#ff3d9a;
--purple:#8b5cf6;
--blue:#00c6ff;
--green:#21e6a3;
--red:#ff4d6d;
--text:#f4f6ff;
--muted:#858da6;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 5% 5%,rgba(255,61,154,.20),transparent 28%),
radial-gradient(circle at 95% 5%,rgba(0,198,255,.18),transparent 30%),
radial-gradient(circle at 50% 100%,rgba(139,92,246,.18),transparent 35%),
var(--bg);
color:var(--text);
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",monospace;
padding:35px 20px;
}

.container{
max-width:1100px;
margin:auto;
}

h1{
margin:0;
font-size:28px;
font-weight:900;
letter-spacing:4px;
background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

h1::after{
content:"LIVE CAMERA VIEWER";
display:block;
margin-top:7px;
font-size:10px;
letter-spacing:2px;
color:var(--muted);
-webkit-text-fill-color:var(--muted);
}

.info{
margin:24px 0;
padding:16px 18px;
border-radius:14px;
background:linear-gradient(
135deg,
rgba(255,61,154,.08),
rgba(59,130,246,.08)
);
border:1px solid var(--border);
color:var(--muted);
box-shadow:0 10px 35px rgba(0,0,0,.18);
}

.info strong{
margin-left:7px;
color:#fff;
font-size:14px;
letter-spacing:1px;
}

.video-wrap{
position:relative;
}

video{
display:block;
width:100%;
min-height:420px;
background:
radial-gradient(circle,#171a2d 0%,#05060c 70%);
border:1px solid rgba(255,255,255,.10);
border-radius:18px;
object-fit:contain;
box-shadow:
0 25px 70px rgba(0,0,0,.45),
0 0 50px rgba(139,92,246,.08);
}

.live-badge{
display:none;
position:absolute;
top:14px;
left:14px;
padding:8px 11px;
border-radius:9px;
background:rgba(180,20,50,.9);
font-size:11px;
font-weight:800;
letter-spacing:1px;
}

.live-badge.active{
display:block;
}

.status{
margin-top:18px;
padding:15px 17px;
border-radius:13px;
background:rgba(255,255,255,.035);
border:1px solid rgba(255,255,255,.08);
color:#cbd1e1;
font-size:13px;
}

.status.ok{
border-color:rgba(33,230,163,.25);
}

.status.error{
border-color:rgba(255,77,109,.3);
color:#ffb3c0;
}

.actions{
display:flex;
gap:10px;
margin-top:18px;
}

button{
padding:14px 22px;
border:0;
border-radius:11px;
color:#fff;
font-family:inherit;
font-weight:800;
font-size:12px;
letter-spacing:.8px;
cursor:pointer;
background:linear-gradient(90deg,var(--pink),var(--purple),#3b82f6);
box-shadow:0 10px 28px rgba(139,92,246,.25);
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

.muted{
margin-top:18px;
color:#68718b;
font-size:11px;
line-height:1.7;
}

@media(max-width:700px){
body{padding:20px 14px}
h1{font-size:22px}
video{min-height:280px}
.actions{flex-direction:column}
button{width:100%}
}

@media(max-width:420px){
body{padding:15px 10px}
h1{font-size:19px}
video{min-height:230px}
}
</style>

</head>

<body>

<div class="container">

<h1>CAMTOOL // VIEWER</h1>

<div class="info">
SESSION:
<strong id="session">---</strong>
</div>

<div class="video-wrap">

<video
id="remoteVideo"
autoplay
playsinline> </video>

<div class="live-badge" id="liveBadge">
● CANLI
</div>

</div>

<div class="status" id="status">
● Görüntüleyici hazırlanıyor...
</div>

<div class="actions">

<button id="retry">
BAĞLANTIYI YENİLE
</button>

<button id="stopBtn" disabled>
AKIŞI DURDUR
</button>

</div>

<p class="muted">
Canlı görüntü yalnızca kamera sahibinin açıkça başlattığı
kamera paylaşımı sonrasında alınır.
</p>

</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>

const params=new URLSearchParams(location.search);
const session=params.get("session");

const video=document.getElementById("remoteVideo");
const statusBox=document.getElementById("status");
const sessionText=document.getElementById("session");
const retryBtn=document.getElementById("retry");
const stopBtn=document.getElementById("stopBtn");
const liveBadge=document.getElementById("liveBadge");

if(!session){

statusBox.textContent="✖ Geçerli bir oturum bulunamadı.";
statusBox.className="status error";

throw new Error("session missing");
}

sessionText.textContent=session;

const cleanSession=session.replace(/[^a-zA-Z0-9]/g,"");

const viewerPeerId="view-"+cleanSession;
const cameraPeerId="cam-"+cleanSession;

let peer=null;
let connection=null;
let currentCall=null;

let retryTimer=null;
let retryCount=0;
let stopped=false;

function setStatus(text,type=""){

statusBox.textContent=text;
statusBox.className="status "+type;

}

function cleanupConnection(){

if(connection){

try{
connection.close();
}catch{}

connection=null;
}

if(currentCall){

try{
currentCall.close();
}catch{}

currentCall=null;
}

}

function cleanupPeer(){

cleanupConnection();

if(peer){

try{
peer.destroy();
}catch{}

peer=null;
}

}

function scheduleRetry(){

if(stopped)return;

clearTimeout(retryTimer);

retryCount++;

const delay=Math.min(
Math.max(2000,retryCount*1500),
10000
);

setStatus(
"● Kamera henüz hazır değil. "+
Math.round(delay/1000)+
" sn sonra tekrar deneniyor..."
);

retryTimer=setTimeout(()=>{
connect();
},delay);

}

function connect(){

if(stopped)return;

clearTimeout(retryTimer);

cleanupPeer();

setStatus("● WebRTC bağlantısı hazırlanıyor...");

peer=new Peer(viewerPeerId,{
debug:2
});

let opened=false;

peer.on("open",()=>{

opened=true;
retryCount=0;

setStatus("● Kamera bağlantısı aranıyor...");

connectToCamera();

});

peer.on("error",(err)=>{

console.error("PeerJS:",err);

if(err.type==="peer-unavailable"){

setStatus(
"● Kamera şu anda çevrimdışı. Bekleniyor..."
);

scheduleRetry();

return;
}

if(err.type==="unavailable-id"){

setStatus(
"✖ Viewer oturum ID'si zaten kullanımda.",
"error"
);

return;
}

setStatus(
"✖ WebRTC hatası: "+(err.type||"bilinmeyen"),
"error"
);

scheduleRetry();

});

peer.on("disconnected",()=>{

if(stopped)return;

setStatus("● WebRTC bağlantısı kesildi.");

scheduleRetry();

});

peer.on("close",()=>{

if(stopped)return;

setStatus("● Viewer bağlantısı kapandı.");

});

peer.on("call",(call)=>{

console.log("Gelen medya çağrısı:",call.peer);

currentCall=call;

setStatus("● Kamera yayını kabul ediliyor...");

call.answer();

call.on("stream",(remoteStream)=>{

video.srcObject=remoteStream;

video.play().catch(()=>{});

liveBadge.classList.add("active");

stopBtn.disabled=false;

setStatus(
"● CANLI AKIŞ AKTİF",
"ok"
);

});

call.on("close",()=>{

liveBadge.classList.remove("active");

stopBtn.disabled=true;

video.srcObject=null;

setStatus(
"● Kamera paylaşımı sona erdi."
);

scheduleRetry();

});

call.on("error",(err)=>{

console.error("Call:",err);

setStatus(
"✖ Video bağlantısı hatası.",
"error"
);

});

});

}

function connectToCamera(){

if(!peer)return;

cleanupConnection();

setStatus(
"● Kamera Peer'i aranıyor..."
);

connection=peer.connect(
cameraPeerId,
{
reliable:true
}
);

let connected=false;

const timeout=setTimeout(()=>{

if(!connected){

try{
connection.close();
}catch{}

setStatus(
"● Kamera yanıt vermedi."
);

scheduleRetry();

}

},8000);

connection.on("open",()=>{

connected=true;

clearTimeout(timeout);

retryCount=0;

setStatus(
"● Kamera bulundu. Canlı yayın bekleniyor..."
);

});

connection.on("data",(data)=>{

console.log("Kamera mesajı:",data);

});

connection.on("close",()=>{

clearTimeout(timeout);

if(!stopped){

setStatus(
"● Kamera bağlantısı kapandı."
);

scheduleRetry();

}

});

connection.on("error",(err)=>{

clearTimeout(timeout);

console.error("Data connection:",err);

if(err.type==="peer-unavailable"){

setStatus(
"● Kamera henüz hazır değil."
);

}else{

setStatus(
"✖ Kamera bağlantı hatası.",
"error"
);

}

scheduleRetry();

});

}

retryBtn.addEventListener("click",()=>{

stopped=false;

retryBtn.disabled=true;

setTimeout(()=>{
retryBtn.disabled=false;
},1000);

connect();

});

stopBtn.addEventListener("click",()=>{

stopped=true;

clearTimeout(retryTimer);

cleanupConnection();

if(video.srcObject){

const tracks=video.srcObject.getTracks();

tracks.forEach(track=>{
track.stop();
});

video.srcObject=null;
}

liveBadge.classList.remove("active");

stopBtn.disabled=true;

setStatus(
"● Görüntü akışı durduruldu."
);

});

window.addEventListener("beforeunload",()=>{

stopped=true;

clearTimeout(retryTimer);

cleanupPeer();

if(video.srcObject){

video.srcObject.getTracks().forEach(track=>{
track.stop();
});

}

});

connect();

</script>

</body>
</html>
